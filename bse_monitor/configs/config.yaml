# ---------------------------------------------------------------------------
# Runtime configuration. Every value can be overridden by an environment
# variable named BSE_<SECTION>_<KEY> (see config.py), so the same file is safe
# to commit and Docker only needs to inject secrets.
# ---------------------------------------------------------------------------
app:
  name: bse-monitor
  timezone: Asia/Kolkata
  data_dir: ./data
  log_level: INFO
  log_file: ./data/logs/bse_monitor.log

database:
  # Overridden in Docker by BSE_DATABASE_URL.
  url: postgresql+psycopg2://bse:bse@localhost:5432/bse_monitor
  echo: false
  pool_size: 5
  max_overflow: 10

scraper:
  # Announcement categories pulled from BSE. "Company Update" and "Result" are
  # noisy but carry a meaningful share of fund-raise disclosures.
  bse_categories:
    - Company Update
    - Corp. Action
    - Board Meeting
    - AGM/EGM
    - Result
    - New Listing
  lookback_days: 3            # window used when no checkpoint exists
  max_pages_per_category: 25
  request_timeout_seconds: 30
  rate_limit_per_second: 2.0
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/124.0 Safari/537.36
  use_playwright_fallback: true
  playwright_headless: true
  enable_nse: false
  enable_sebi: false

pdf:
  enabled: true
  download_dir: ./data/pdfs
  max_bytes: 52428800         # 50 MB guard
  max_pages_text: 60
  ocr_enabled: true
  ocr_language: eng
  ocr_dpi: 200
  ocr_max_pages: 12
  # Below this many extracted characters per page the text layer is considered
  # absent and the OCR fallback kicks in.
  ocr_trigger_chars_per_page: 120
  extract_tables: true
  concurrency: 4

classifier:
  min_confidence: 0.35        # below this a filing is tagged Other
  use_ml_model: false
  ml_model_path: ./data/models/filing_clf.joblib
  spacy_model: en_core_web_sm

scoring:
  # Category base scores, straight from the event-detection spec.
  base_scores:
    PromoterSale: 95
    QIP: 90
    InvestorExit: 90
    OFS: 92
    BlockDeal: 88
    IPO: 80
    FPO: 82
    RightsIssue: 78
    PreferentialAllotment: 80
    FundRaise: 85
    Other: 20
  certainty_modifiers:
    completed: 6
    approved: 8
    intended: 3
    unknown: 0
  amount_modifiers:            # INR crore thresholds, first match wins
    - {min_cr: 5000, bonus: 10}
    - {min_cr: 1000, bonus: 7}
    - {min_cr: 250,  bonus: 4}
    - {min_cr: 50,   bonus: 2}
  marquee_investor_bonus: 5
  promoter_involved_bonus: 5
  large_stake_bonus: 5         # when extracted stake % exceeds threshold
  large_stake_threshold_pct: 5.0
  lock_in_window_bonus: 4      # lock-in expiring inside horizon_days
  lock_in_horizon_days: 45
  recency_decay_per_day: 1.5   # subtracted per day of filing age
  recency_max_penalty: 12
  low_confidence_penalty: 10   # applied when confidence < classifier.min_confidence

triggers:
  # Forward calendar of statutory deadlines derived from filings.
  #
  # Every offset is listed explicitly even where it matches the code default:
  # env overrides are resolved by walking THIS file, so an omitted key means
  # BSE_TRIGGERS_OFFSETS_<KEY> is silently ignored.
  enabled: true
  rule_version: v1
  horizon_days: 180
  # Reminder lead times. Override in comma form: BSE_TRIGGERS_ALERT_HORIZONS_DAYS="30,7,1"
  alert_horizons_days: [30, 7, 1]
  min_confidence: 0.4
  # Feed the nearest derived deadline into the opportunity score's lock-in bonus.
  feed_scoring: true
  offsets:
    anchor_lockin_short_days: 30
    anchor_lockin_long_days: 90
    preipo_lockin_months: 6
    promoter_excess_lockin_months: 6
    promoter_mpc_lockin_months: 18
    capex_objects_short_months: 12
    capex_objects_long_months: 36
    mps_compliance_months: 36
    qip_resolution_validity_days: 365
    trading_window_reopen_hours: 48

llm:
  # Layer 2: Claude Haiku event extraction over the first pages of each filing.
  # Disabled by default so a fresh checkout and the whole test suite stay offline.
  enabled: false
  model: claude-haiku-4-5
  # Blank defers to the SDK's own ANTHROPIC_API_KEY resolution.
  # Inject with BSE_LLM_API_KEY (works only because this key exists here).
  api_key: ""
  prompt_version: v1
  max_tokens: 1024
  max_pages: 3
  max_chars: 12000
  timeout_seconds: 60
  max_retries: 3
  backoff_base_seconds: 2.0
  backoff_max_seconds: 30.0
  # Rule-prefiltered gating: only filings the rule engine already finds
  # interesting, or cannot classify, are sent.
  max_calls_per_run: 200
  min_priority: MEDIUM
  send_unclassified: true
  cache_enabled: true
  rule_floor: 0.5
  override_threshold: 0.75
  persist_raw_response: true
  batch:
    enabled: false
    max_requests: 1000
    poll_seconds: 60
    max_wait_seconds: 86400
  pricing:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_write_multiplier: 1.25
    cache_read_multiplier: 0.1
    batch_multiplier: 0.5

alerts:
  enabled: true
  high_priority_min_score: 85
  medium_priority_min_score: 65
  # Categories that are always high priority regardless of score.
  always_high_categories: [OFS, PromoterSale, InvestorExit, QIP]
  channels:
    csv:
      enabled: true
      output_dir: ./data/exports
    email:
      enabled: false
      smtp_host: smtp.example.com
      smtp_port: 587
      use_tls: true
      username: ""
      password: ""           # inject via BSE_ALERTS_EMAIL_PASSWORD
      sender: bse-monitor@example.com
      recipients: []
    slack:
      enabled: false
      webhook_url: ""        # inject via BSE_ALERTS_SLACK_WEBHOOK_URL
      min_priority: HIGH
    teams:
      enabled: false
      webhook_url: ""
      min_priority: HIGH

scheduler:
  enabled: true
  # BSE disseminates continuously through the trading day; a 15-minute cadence
  # during market hours with a wider evening sweep catches post-close filings.
  intraday_cron: "*/15 6-16 * * 1-5"     # UTC ≈ 11:30-22:00 IST
  evening_sweep_cron: "30 16 * * 1-5"    # UTC ≈ 22:00 IST
  backfill_cron: "0 2 * * 6"             # Saturday reconciliation sweep
