# Heuristics for harvesting untracked institutional entities from free text.
discovery:
  # An ORG mention is promoted to a candidate investor when it ends with one of
  # these and sits within the configured window of a sell/buy verb.
  generic_suffixes:
    - capital
    - partners
    - fund
    - funds
    - holdings
    - investments
    - ventures
    - advisors
    - asset management
    - mutual fund
    - trust
    - pte ltd
    - pte. ltd.
    - mauritius
    - llp
  # Words that disqualify a candidate (exchanges, regulators, intermediaries).
  stoplist:
    - bse limited
    - national stock exchange
    - securities and exchange board of india
    - sebi
    - registrar
    - depository
    - national securities depository
    - central depository services
    - stock exchange
