# ---------------------------------------------------------------------------
# Tracked investor registry.
#
# `aliases` are matched case-insensitively on word boundaries. `marquee: true`
# adds a bonus to the opportunity score, because a sell-down by one of these
# names is materially more likely to translate into a tradeable block.
#
# Entities not listed here are still captured: the extractor falls back to
# spaCy ORG entities filtered by the `generic_suffixes` heuristics below.
# ---------------------------------------------------------------------------
