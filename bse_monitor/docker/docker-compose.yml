# Run from the repository root:
#   docker compose -f bse_monitor/docker/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: bse-monitor-db
    environment:
      POSTGRES_USER: bse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bse}
      POSTGRES_DB: bse_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bse -d bse_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the schema, then exits.
  init:
    build:
      context: ../..
      dockerfile: bse_monitor/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      BSE_DATABASE_URL: postgresql+psycopg2://bse:${POSTGRES_PASSWORD:-bse}@db:5432/bse_monitor
      BSE_APP_DATA_DIR: /app/data
      BSE_APP_LOG_FILE: /app/data/logs/bse_monitor.log
      BSE_PDF_DOWNLOAD_DIR: /app/data/pdfs
      BSE_ALERTS_CHANNELS_CSV_OUTPUT_DIR: /app/data/exports
      BSE_BRIEF_OUTPUT_DIR: /app/data/briefs
      BSE_MODEL_PANEL_DIR: /app/data/panel
      BSE_MODEL_MODEL_PATH: /app/data/models/selldown_lgbm.joblib
      BSE_BRIEF_MODEL_PATH: /app/data/models/selldown_lgbm.joblib
      # Layer 2. Leave BSE_LLM_ENABLED unset to run rules-only.
      BSE_LLM_ENABLED: ${LLM_ENABLED:-false}
      BSE_LLM_API_KEY: ${ANTHROPIC_API_KEY:-}
      # SMTP for the 08:00 IST brief.
      BSE_ALERTS_CHANNELS_EMAIL_SMTP_HOST: ${SMTP_HOST:-}
      BSE_ALERTS_CHANNELS_EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      BSE_ALERTS_CHANNELS_EMAIL_USERNAME: ${SMTP_USERNAME:-}
      BSE_ALERTS_CHANNELS_EMAIL_SENDER: ${SMTP_SENDER:-bse-monitor@example.com}
      BSE_ALERTS_SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      BSE_ALERTS_CHANNELS_SLACK_ENABLED: ${SLACK_ENABLED:-false}
      BSE_ALERTS_CHANNELS_TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      BSE_ALERTS_CHANNELS_EMAIL_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - appdata:/app/data
    # --upgrade also applies additive column migrations; create_all() only ever
    # creates missing tables, never adds a column to an existing one.
    command: ["init-db", "--upgrade"]
    restart: "no"

  # Long-running scheduler: intraday, evening sweep and weekly backfill.
  monitor:
    build:
      context: ../..
      dockerfile: bse_monitor/docker/Dockerfile
    container_name: bse-monitor
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment: *env
    volumes:
      - appdata:/app/data
    command: ["schedule"]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
